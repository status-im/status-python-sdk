name: Tests

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  transaction-history:
    name: Transaction History (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        run: python -m pip install .

      - name: Run transaction-history regressions
        run: python -m unittest discover -s tests -v

      - name: Check request counts and timestamp correctness over loopback HTTP
        run: python -m benchmarks.transaction_history --repeats 1

  version:
    name: Verify Version Bump
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging
        run: python -m pip install --upgrade packaging

      - name: Compare versions
        run: python .github/tests/version.py
